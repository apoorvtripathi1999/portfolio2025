<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="32" height="32" fill="#00BFFF" rx="4"/>
  
  <!-- Monitor Base -->
  <rect x="10" y="22" width="12" height="3" fill="#333333" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="25" width="4" height="2" fill="#333333"/>
  
  <!-- Monitor Screen -->
  <rect x="6" y="8" width="20" height="14" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Screen Content -->
  <rect x="8" y="10" width="16" height="10" fill="#00FF00"/>
  
  <!-- Code Lines -->
  <rect x="9" y="11" width="8" height="1" fill="#000000"/>
  <rect x="9" y="13" width="12" height="1" fill="#000000"/>
  <rect x="9" y="15" width="6" height="1" fill="#000000"/>
  <rect x="9" y="17" width="10" height="1" fill="#000000"/>
  
  <!-- Cursor -->
  <rect x="19" y="17" width="1" height="1" fill="#FF0000"/>
</svg>